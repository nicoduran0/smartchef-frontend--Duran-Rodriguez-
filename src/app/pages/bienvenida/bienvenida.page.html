<ion-content [scrollY]="false" class="bienvenida">
  <div class="fondo"></div>

  <div class="contenido">
    <div class="marca">
      <h1 class="logo">Smart<span>Chef</span></h1>
      <p class="eslogan">Tu cocina inteligente, tus recetas deseadas</p>
    </div>

    <div class="acciones">
      <ion-button color="primary" shape="round" routerLink="/login">
        Iniciar sesión
      </ion-button>
      <ion-button color="secondary" shape="round" routerLink="/registro">
        Crear cuenta
      </ion-button>
    </div>
  </div>
</ion-content>
