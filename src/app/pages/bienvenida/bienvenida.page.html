<ion-content [fullscreen]="true" [scrollY]="false" class="bienvenida">
  <div class="fondo"></div>

  <div class="contenido">
    <div class="marca">
      <img class="logo-img" src="assets/img/logo.png" alt="SmartChef" />
      <p class="eslogan">Tu cocina inteligente, tus recetas saludables.</p>
    </div>

    <div class="acciones">
      <ion-button color="primary" shape="round" (click)="ir('/login')">Iniciar sesión</ion-button>
      <ion-button color="secondary" shape="round" (click)="ir('/registro')">Crear cuenta</ion-button>
    </div>
  </div>
</ion-content>
